<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>{{ partial "head.html" . }}</head>
<body class="min-h-screen flex flex-col bg-rams-mist text-black dark:bg-rams dark:text-white font-sans">
  {{ partial "header.html" . }}

  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-10">
    <a href="{{ "/" | relURL }}" class="text-xs text-black/45 dark:text-white/55 hover:underline">← Home</a>

    <h1 class="mt-6 text-3xl font-bold tracking-tight leading-tight">{{ .Title }}</h1>
    {{- with .Date }}
    <p class="mt-2 text-xs text-black/45 dark:text-white/55 tabular-nums">{{ .Format "2006-01-02" }}</p>
    {{- end }}

    <div class="mt-8 prose max-w-none text-sm leading-relaxed text-black dark:prose-invert dark:text-white">
      {{ .Content }}
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
