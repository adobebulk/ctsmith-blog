<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>{{ partial "head.html" . }}</head>
<body class="min-h-screen flex flex-col bg-rams-mist text-black dark:bg-rams dark:text-white font-sans">
  {{ partial "header.html" . }}

  <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold tracking-tight">{{ .Title }}</h1>

    <ul class="mt-8 space-y-6">
      {{- range where .Pages "Params.draft" "ne" true -}}
      <li>
        <a href="{{ .RelPermalink }}" class="group block">
          <span class="text-sm font-semibold group-hover:underline">{{ .Title }}</span>
          <span class="ml-3 text-xs text-black/45 dark:text-white/55 tabular-nums">{{ .Date.Format "2006-01-02" }}</span>
          {{- with .Params.excerpt }}
          <p class="mt-1 text-xs text-black/55 dark:text-white/65 leading-relaxed">{{ . }}</p>
          {{- end }}
        </a>
      </li>
      {{- end -}}
    </ul>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
