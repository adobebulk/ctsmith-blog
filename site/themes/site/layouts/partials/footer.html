{{- $s := .Site.Data.settings -}}
<footer class="px-6 py-4 text-xs text-black/50 dark:text-white/50 border-t border-black/10 dark:border-white/20 flex items-center justify-between gap-4">
  <span>© {{ now.Year }} {{ $s.photographer | default .Site.Params.photographer }}</span>
  {{- with .Site.Data.version -}}
  <span class="text-xs opacity-40">v{{ .version }}</span>
  {{- end -}}
</footer>
